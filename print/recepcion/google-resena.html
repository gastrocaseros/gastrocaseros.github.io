<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartel recepción — Reseña Google</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <article class="card" data-card="google">
    <header class="brand">
      <img src="assets/logo.png" alt="GastroCaseros" />
      <div class="brand-text">
        <span class="brand-name">GastroCaseros</span>
        <span class="brand-tag">Consultorio · Caseros</span>
      </div>
    </header>

    <h1 class="headline">Tu opinión nos ayuda</h1>
    <p class="subhead">Si tu visita te resultó útil, una reseña en Google nos ayuda a que más personas nos encuentren. Solo si querés — sin compromiso.</p>

    <div class="qr-wrap">
      <div class="qr-frame google">
        <img class="qr" src="assets/qr-google.png" alt="QR para dejar una reseña en Google" />
        <span class="handle">Reseña en Google</span>
      </div>
    </div>

    <div class="meta">
      <p class="meta-soft">Escaneá cuando tengas un momento. Gracias.</p>
    </div>

    <footer class="footer">
      <span class="footer-web">gastrocaseros.com.ar</span>
      <span class="footer-note">Google</span>
    </footer>
  </article>
</body>
</html>

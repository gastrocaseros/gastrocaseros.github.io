<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartel recepción — WiFi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <article class="card" data-card="wifi">
    <div class="placeholder-banner">Clave placeholder</div>
    <header class="brand">
      <img src="assets/logo.png" alt="GastroCaseros" />
      <div class="brand-text">
        <span class="brand-name">GastroCaseros</span>
        <span class="brand-tag">Consultorio · Caseros</span>
      </div>
    </header>

    <h1 class="headline">WiFi para pacientes</h1>
    <p class="subhead">Escaneá el código para conectarte, o usá los datos de abajo.</p>

    <div class="qr-wrap">
      <div class="qr-frame">
        <img class="qr" src="assets/qr-wifi.png" alt="QR WiFi del consultorio" />
        <span class="handle">Conectate al WiFi</span>
      </div>
    </div>

    <div class="wifi-creds">
      <div class="label">Red</div>
      <div class="value">GastroCaseros-Invitados</div>
      <div class="label">Contraseña</div>
      <div class="value">CAMBIAR-CLAVE</div>
    </div>

    <footer class="footer">
      <span class="footer-web">gastrocaseros.com.ar</span>
      <span class="footer-note">WiFi</span>
    </footer>
  </article>
</body>
</html>

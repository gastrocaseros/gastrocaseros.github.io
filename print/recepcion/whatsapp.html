<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartel recepción — WhatsApp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <article class="card" data-card="whatsapp">
    <header class="brand">
      <img src="assets/logo.png" alt="GastroCaseros" />
      <div class="brand-text">
        <span class="brand-name">GastroCaseros</span>
        <span class="brand-tag">Consultorio · Caseros</span>
      </div>
    </header>

    <h1 class="headline">Turnos por WhatsApp</h1>
    <p class="subhead">Escaneá el código para escribirnos. Consultas y turnos de forma simple.</p>

    <div class="qr-wrap">
      <div class="qr-frame wa">
        <img class="qr" src="assets/qr-whatsapp.png" alt="QR WhatsApp GastroCaseros" />
        <div class="handle-row">
          <img src="assets/icon-whatsapp.svg" alt="" />
          <span class="handle">11 2457-3240</span>
        </div>
      </div>
    </div>

    <div class="meta">
      <p class="meta-soft">Respondemos en horario de atención.</p>
    </div>

    <footer class="footer">
      <span class="footer-web">gastrocaseros.com.ar</span>
      <span class="footer-note">WhatsApp</span>
    </footer>
  </article>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartel recepción — Instagram</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <article class="card" data-card="instagram">
    <header class="brand">
      <img src="assets/logo.png" alt="GastroCaseros" />
      <div class="brand-text">
        <span class="brand-name">GastroCaseros</span>
        <span class="brand-tag">Consultorio · Caseros</span>
      </div>
    </header>

    <h1 class="headline">Seguinos en Instagram</h1>
    <p class="subhead">Escaneá el código y encontranos en redes. Tips, estudios y novedades del consultorio.</p>

    <div class="qr-wrap">
      <div class="qr-frame ig">
        <img class="qr" src="assets/qr-instagram.png" alt="QR Instagram @gastrocaseros" />
        <span class="handle">@gastrocaseros</span>
      </div>
    </div>

    <footer class="footer">
      <span class="footer-web">gastrocaseros.com.ar</span>
      <span class="footer-note">Instagram</span>
    </footer>
  </article>
</body>
</html>
